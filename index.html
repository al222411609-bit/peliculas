<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recomendador de películas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="encabezado">¡Bienvenidos al cine   Yessica Maria Martinez Hernandez</h1>
  <h3> Menú</h3>

  <p>
    Queremos hacer de tu visita una experiencia más placentera. Para eso,
    ingresa tu edad y selecciona el género que más te guste,
    y te recomendamos tu película ideal.
  </p>

  <div class="campo">
    <label for="edad">Edad:</label>
    <input type="number" id="edad" min="2" max="120" placeholder="Ej. 20">
  </div>

  <div class="botones">
    <button data-genero="Drama">Drama</button>
    <button data-genero="Comedia">Comedia</button>
    <button data-genero="Musical">Musical</button>
    <button data-genero="Crimen">Crimen</button>
  </div>

  <p id="mensaje" class="error"></p>

  <h3>Nuestra recomendación:</h3>
  <h2 id="resultado"></h2>
  <p id="descripcion"></p>

  <script src="script.js"></script>
</body>
</html>
